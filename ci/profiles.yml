# Acts as a bridge that connects dbt to the database

analytics: # name of the profile
  target: prod # environment to use for dbt run
  outputs:
    prod: # for production deployment
      type: duckdb # adapter to use for dbt run
      path: ../data/prod.duckdb # the path to save the database file
      threads: 4 # runs 4 models at a time

# analytics: # name of the profile
#   target: dev # environment to use for dbt run
#   outputs:
